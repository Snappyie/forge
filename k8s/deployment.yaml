# The Forge API and background runtime (spec 15).
#
# Apply in order: config.yaml, migrate-job.yaml, then this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-server
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep full capacity during a rollout; a lost slot could stall executions.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: forge
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spreading replicas keeps a single node failure from taking the
      # platform down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: forge
              app.kubernetes.io/component: server
      # A rolling update must give in-flight executions time to finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: forge-server
          image: forge/server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: forge-config
            - secretRef:
                name: forge-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness is public and touches no dependency, so a database outage
          # does not restart a process that is merely waiting.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check the database: a replica that cannot reach it
          # should leave the load-balancer rotation.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                # SIGTERM then runs the graceful shutdown path.
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: forge-server-svc
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-server
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
  annotations:
    # The application enforces its own limit; this is a coarse outer bound.
    nginx.ingress.kubernetes.io/limit-rps: "200"
spec:
  ingressClassName: nginx
  rules:
    - host: forge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forge-server-svc
                port:
                  name: http
  # TLS terminates here; spec 15 requires transport security.
  tls:
    - hosts:
        - forge.example.com
      secretName: forge-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-server
  namespace: forge-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forge
      app.kubernetes.io/component: server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Only the ingress controller may reach the API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # PostgreSQL and DNS only. The HTTP executor is constrained by the
    # application-level SSRF guard (spec 11); this is the outer boundary.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forge-postgres
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
