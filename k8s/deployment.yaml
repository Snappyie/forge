apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-server
  namespace: forge-system
  labels:
    app: forge-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: forge-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: forge-server
    spec:
      containers:
      - name: forge-server
        image: forge/server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: forge-db-secret
              key: database_url
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: forge-server-svc
  namespace: forge-system
spec:
  selector:
    app: forge-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
