# Kubernetes manifests for a single-region deployment (spec 15).
#
# Apply in this order:
#   1. config.yaml       (ConfigMap + Secret)
#   2. migrate-job.yaml  (one-shot schema migration)
#   3. deployment.yaml   (the API and background runtime)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-config
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
data:
  FORGE_SERVER_HOST: "0.0.0.0"
  FORGE_SERVER_PORT: "3000"
  FORGE_LOG_LEVEL: "info"
  # Structured logs for a cluster log pipeline.
  FORGE_LOG_FORMAT: "json"
  FORGE_DEFAULT_TIMEZONE: "UTC"
  FORGE_SCHEDULER_ENABLED: "true"
  FORGE_SCHEDULER_POLL_INTERVAL: "5s"
  FORGE_SCHEDULER_BATCH_SIZE: "100"
  FORGE_SCHEDULER_MAX_CATCH_UP: "100"
  FORGE_RETENTION_EXECUTIONS: "30d"
  FORGE_RETENTION_AUDIT: "365d"
  # Several replicas may run the scheduler; the database claim leases keep
  # exactly one owner per occurrence (spec 09.3).
  FORGE_RATE_LIMIT_PER_SECOND: "100"
  FORGE_RATE_LIMIT_BURST: "200"
  RUST_LOG: "info,forge_server=debug"
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-db-secret
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
type: Opaque
stringData:
  # Replaced by the deployment operator. Spec 17.6 requires startup to fail
  # when these are absent, so no default is supplied here.
  FORGE_DATABASE_URL: "postgres://forge:CHANGE_ME@forge-postgres:5432/forgedb"
  FORGE_AUTH_SESSION_SECRET: "CHANGE_ME"
  FORGE_API_KEY_HASHING_SECRET: "CHANGE_ME"
