{{/*
The API server: Deployment, Service, ServiceAccount, HPA and PDB.

Leader election is a Postgres advisory lock acquired per tick, so running the
scheduler on every replica is safe - the others simply do not lead. That is why
`scheduler.enabled` is a flag rather than a separate deployment.
*/}}
{{- if not .Values.database.external }}
{{- fail "database.external must be true: this chart does not manage Postgres. Point database.url at a managed database, or install a database chart alongside this one." }}
{{- end }}
{{- if not .Values.secrets.authSessionSecret }}
{{- fail "secrets.authSessionSecret is required. An empty value would be read as *present* by forge-config, so the pod would start and then fail inside the crypto instead of reporting a missing secret." }}
{{- end }}
{{- if not .Values.secrets.apiKeyHashingSecret }}
{{- fail "secrets.apiKeyHashingSecret is required (see authSessionSecret above)." }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "forge.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for an in-flight execution to finish or for the lease to
      # expire; killing a pod mid-execution is safe but costs a retry.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: forge
          image: {{ include "forge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "forge.env" . | nindent 12 }}
            - name: FORGE_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "forge.secretName" . }}
                  key: auth-session-secret
            - name: FORGE_API_KEY_HASHING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "forge.secretName" . }}
                  key: api-key-hashing-secret
            - name: FORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (include "forge.secretName" .) }}
                  key: {{ .Values.database.existingSecretKey }}
          # Liveness is public and touches no dependency, so a database blip
          # cannot cause a restart loop of every pod at once.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness checks the database, so a pod with a broken connection is
          # taken out of rotation instead of receiving traffic.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Generous: migrations run first, and a slow database must not be
          # mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "forge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge.serviceAccountName" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Also a hook, with a lower weight than the migration Job.
    #
    # The Job is a `pre-install` hook, so it runs before the ordinary resources -
    # including this ServiceAccount, which did not exist yet. The pod was then
    # refused with `serviceaccount "forge-sa" not found` and the migration never
    # ran. Helm executes hooks in ascending weight, so weight -10 puts the
    # account in place first.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
# The API needs no Kubernetes API access: it reaches only Postgres, which is
# identified by credentials in a Secret. Deliberately no RBAC rules.
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.api.podDisruptionBudget.enabled (gt (int .Values.api.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "forge.fullname" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  # At least two, so a node drain cannot take the whole API out.
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "forge.fullname" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "forge.fullname" . }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}