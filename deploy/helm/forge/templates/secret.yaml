{{- if not .Values.existingSecret }}
{{/*
The session and hashing keys.

Both are required by forge-config at startup. Rendering them from values rather
than accepting a literal `CHANGE_ME` means the chart fails fast on a missing
value instead of starting a pod that dies inside the crypto.

The whole file is wrapped in the `if`: a template that renders to whitespace
still produces a YAML document, and an empty document has no `apiVersion`, so
`helm install` fails with "error validating data: apiVersion not set" whenever
`existingSecret` is set. The guard has to be on the outermost action so nothing
is emitted at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge.secretName" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  annotations:
    # A hook with a lower weight than the migration Job (-5), for the same
    # reason the ServiceAccount is one: the Job runs before ordinary resources,
    # so the Secret it mounts must already exist. Without this the pod is
    # refused with `secret "forge-secrets" not found` and no migration runs.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  auth-session-secret: {{ required "secrets.authSessionSecret is required" .Values.secrets.authSessionSecret | quote }}
  api-key-hashing-secret: {{ required "secrets.apiKeyHashingSecret is required" .Values.secrets.apiKeyHashingSecret | quote }}
  {{- if .Values.database.url }}
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- else if not .Values.database.external }}
  {{ .Values.database.existingSecretKey }}: ""
  {{- end }}
{{- end }}