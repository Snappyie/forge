[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
chrono.workspace = true
# A per-process scheduler instance identity, used for leadership and claims.
uuid.workspace = true
sqlx.workspace = true
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
forge-config = { path = "../forge-config" }
forge-domain = { path = "../forge-domain" }
forge-scheduler = { path = "../forge-scheduler" }
forge-storage = { path = "../forge-storage" }
forge-executor = { path = "../forge-executor" }
forge-api = { path = "../forge-api" }
forge-events = { path = "../forge-events" }
