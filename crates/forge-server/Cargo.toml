[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# A library so the serving layer can be tested and reused; `main.rs` is a thin
# binary that wires configuration, the pool and the background runtime together.
[lib]
name = "forge_server"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
chrono.workspace = true
# A per-process scheduler instance identity, used for leadership and claims.
uuid.workspace = true
sqlx.workspace = true
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
forge-config = { path = "../forge-config" }
forge-domain = { path = "../forge-domain" }
forge-scheduler = { path = "../forge-scheduler" }
forge-storage = { path = "../forge-storage" }
forge-executor = { path = "../forge-executor" }
forge-api = { path = "../forge-api" }
forge-events = { path = "../forge-events" }
# The statically exported console, embedded at compile time.
rust-embed.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
axum = "0.7"
tokio = { workspace = true, features = ["full"] }
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
