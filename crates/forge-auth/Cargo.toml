[package]
name = "forge-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
jsonwebtoken = "9.2"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
url = "2"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
forge-domain = { path = "../forge-domain" }
# OIDC: discovery, the authorization-code exchange, and JWKS signature
# verification. `reqwest` is used directly rather than pulling a provider
# framework, because the console only needs authorization-code + PKCE and a
# framework would bring its own session and retry behaviour to reason about.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }